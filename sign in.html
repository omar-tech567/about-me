<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sign in</title>
    <form action="my project.html">
    <link rel="stylesheet" href="sign in.css"/>
</head>
<body>
    <form>
        
    <div>
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" placeholder="Enter your full name" style="padding: 12px; font-size: 16px; width: 100%; height: 45px; box-sizing: border-box;">
    </div>
    <br><br>

    <div>
        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" name="dob" style="padding: 12px; font-size: 16px; width: 100%; height: 45px; box-sizing: border-box;">
    </div>
    <br><br>

    <div>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" style="padding: 12px; font-size: 16px; width: 100%; height: 45px; box-sizing: border-box;">
    </div>
    <br><br>

    <div>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" placeholder="Enter your password" style="padding: 12px; font-size: 16px; width: 100%; height: 45px; box-sizing: border-box;">
    </div>
    <br><br> <hr>

    <button type="submit" style="padding: 12px 30px; font-size: 18px; font-weight: bold; cursor: pointer; border-radius: 8px; border: none; background-color: #061300; color: white;">Submit</button>
</form>
<br> 
Already have an account? <a href="login.html">Sign In</a>

        




    
    
</body>
</html>
